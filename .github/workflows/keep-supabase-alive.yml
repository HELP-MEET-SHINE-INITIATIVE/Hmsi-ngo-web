name: Keep Supabase Alive

on:
  schedule:
    # Runs every 4 days at 08:00 UTC
    - cron: '0 8 */4 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://mutosvokcxkpiqxewcva.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_KEY" ]; then
            echo "Error: SUPABASE_ANON_KEY secret is empty or missing."
            exit 1
          fi
          curl -f -s -o /dev/null \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "${SUPABASE_URL}/rest/v1/"
